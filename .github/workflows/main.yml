name: Build Xiaomi HyperOS Dialer APK & Source ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Genuine Android APK (HyperOS 2.0.5.0)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Setup Android SDK (API 34 - Android 14)
        uses: android-actions/setup-android@v3

      - name: 4. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 5. Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: 6. Build Web Application (Vite)
        run: |
          npm run build

      - name: 7. Sync Capacitor Native Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 8. Build Genuine Signed Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: 9. Collect & Verify Compiled APK
        run: |
          mkdir -p output
          APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No APK file found in android/app/build/outputs/apk/debug!"
            exit 1
          fi
          
          cp "$APK_SRC" output/Xiaomi-HyperOS-Dialer-v2.0.5.apk
          echo "========================================="
          echo "✅ REAL ANDROID APK SUCCESSFULLY COMPILED!"
          echo "File: output/Xiaomi-HyperOS-Dialer-v2.0.5.apk"
          ls -lh output/Xiaomi-HyperOS-Dialer-v2.0.5.apk
          echo "========================================="

      - name: 10. Generate Clean Project ZIP
        run: |
          python3 -c "
          import zipfile, os
          exclude_dirs = {
              'node_modules', '.git', 'dist', '.aistudio', 'output',
              '.gradle', 'build'
          }
          zip_filename = 'output/xiaomi-hyperos-dialer.zip'
          with zipfile.ZipFile(zip_filename, 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in exclude_dirs and not d.startswith('.')]
                  for file in files:
                      if file.endswith('.zip') or file.endswith('.apk') or file.startswith('.'):
                          if file not in ['.env.example', '.gitignore']:
                              continue
                      filepath = os.path.join(root, file)
                      arcname = os.path.relpath(filepath, '.')
                      zipf.write(filepath, arcname)
          "
          ls -lh output/xiaomi-hyperos-dialer.zip

      - name: 11. Upload Compiled APK & Source ZIP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-HyperOS-Dialer-v2.0.5-APK
          path: |
            output/Xiaomi-HyperOS-Dialer-v2.0.5.apk
            output/xiaomi-hyperos-dialer.zip
          retention-days: 30
