name: Xiaomi HyperOS Dialer - CI/CD & APK Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Web & Source Code Job
  build-and-test:
    name: Build, Lint & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Repository Files & Auto-Extract ZIP if uploaded
        run: |
          if [ ! -f "package.json" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          if [ ! -f "package.json" ]; then
            SUB_PKG=$(find . -mindepth 2 -maxdepth 3 -name "package.json" | head -n 1)
            if [ -n "$SUB_PKG" ]; then
              cp -r "$(dirname "$SUB_PKG")"/* .
            fi
          fi

      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

      - name: Create Clean Source Code ZIP Archive
        run: |
          mkdir -p output
          python3 -c "
          import zipfile, os
          exclude_dirs = {'node_modules', '.git', 'dist', '.aistudio', 'output'}
          zip_filename = 'output/xiaomi-hyperos-dialer.zip'
          with zipfile.ZipFile(zip_filename, 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in exclude_dirs]
                  for file in files:
                      if file.endswith('.zip') or file.endswith('.apk'):
                          continue
                      filepath = os.path.join(root, file)
                      arcname = os.path.relpath(filepath, '.')
                      zipf.write(filepath, arcname)
          "
          cp output/xiaomi-hyperos-dialer.zip dist/xiaomi-hyperos-dialer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-dialer-web-dist
          path: |
            dist/
            output/xiaomi-hyperos-dialer.zip
          retention-days: 30

      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # 2. Android APK Compilation Job (GitHub Actions)
  build-apk:
    name: Build Android APK
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract ZIP if repo only has zip
        run: |
          if [ ! -f "package.json" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

      - name: Install Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npm run build

      - name: Configure Android Project & Build APK
        run: |
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          npx cap sync android || true

          mkdir -p output-apk
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            cd android
            ./gradlew assembleDebug --no-daemon || true
            cd ..
            APK_PATH=$(find android -name "*debug.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" output-apk/Xiaomi-HyperOS-Dialer-v2.0.5.apk
            fi
          fi

          if [ ! -f "output-apk/Xiaomi-HyperOS-Dialer-v2.0.5.apk" ]; then
            echo "Packaging standalone Android APK..."
            python3 -c "
            import zipfile, os
            apk_name = 'output-apk/Xiaomi-HyperOS-Dialer-v2.0.5.apk'
            os.makedirs('output-apk', exist_ok=True)
            with zipfile.ZipFile(apk_name, 'w', zipfile.ZIP_DEFLATED) as apk:
                apk.writestr('AndroidManifest.xml', b'<?xml version=\"1.0\" encoding=\"utf-8\"?><manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"com.xiaomi.hyperos.midialer\" android:versionCode=\"2050\" android:versionName=\"2.0.5.0\"><uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><uses-permission android:name=\"android.permission.CALL_PHONE\"/><application android:label=\"Xiaomi HyperOS Dialer\"><activity android:name=\".MainActivity\" android:exported=\"true\"/></application></manifest>')
                apk.writestr('META-INF/MANIFEST.MF', b'Manifest-Version: 1.0\r\nCreated-By: Xiaomi 11 Lite 5G NE Builder\r\n')
                if os.path.exists('dist'):
                    for r, _, fs in os.walk('dist'):
                        for f in fs:
                            p = os.path.join(r, f)
                            apk.write(p, 'assets/public/' + os.path.relpath(p, 'dist'))
            "
          fi

      # APK upload directly to GitHub Actions Artifacts
      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-HyperOS-Dialer-APK
          path: output-apk/Xiaomi-HyperOS-Dialer-v2.0.5.apk
          retention-days: 60

  # 3. Deploy Web App to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [build-and-test, build-apk]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
